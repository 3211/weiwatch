# WeiWatch behind nginx at https://example.com/weiwatch
#
# Paste this inside the HTTPS server block for the domain. The trailing slash
# on proxy_pass strips the /weiwatch prefix, so the container sees /, /api/*,
# /proxy and /socket.io exactly as it does standalone.
#
# The app uses relative asset/API paths and derives its Socket.IO path from the
# current URL, so no rebuild is needed for a different prefix.

location = /weiwatch {
    return 301 /weiwatch/;
}

location /weiwatch/ {
    proxy_pass http://127.0.0.1:3000/;
    proxy_http_version 1.1;

    # WebSocket upgrade for Socket.IO.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /weiwatch;

    # Long-lived sockets and proxied video streams.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    client_max_body_size 8m;
}
